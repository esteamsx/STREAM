name: ES Teams TV Android Build

on:
  push:
    branches:
      - mobile-app
    paths:
      - 'native-app/**'
      - 'middleware/promo-slot.js'
      - 'public/native-browser.js'
      - '.github/workflows/android.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: native-app/package-lock.json

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install dependencies
        working-directory: native-app
        run: npm ci

      - name: Build native browser handler
        working-directory: native-app
        run: npm run build:native-browser

      - name: Prepare app icon
        working-directory: native-app
        run: |
          node --input-type=module -e 'import sharp from "sharp"; await sharp("assets/icon.png").resize(1024, 1024).png().toFile("assets/icon-1024.png");'
          mv assets/icon-1024.png assets/icon.png

      - name: Generate Android and iOS assets
        working-directory: native-app
        run: npx capacitor-assets generate --iconBackgroundColor '#080B18' --iconBackgroundColorDark '#080B18'

      - name: Sync Capacitor Android
        working-directory: native-app
        run: npx cap sync android

      - name: Build debug APK
        working-directory: native-app/android
        run: chmod +x gradlew && ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ES-Teams-TV-debug-APK
          path: native-app/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Decode Android release keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          set +x
          if [ -z "${ANDROID_KEYSTORE_BASE64:-}" ]; then
            echo '::error::ANDROID_KEYSTORE_BASE64 is unavailable to this workflow. Check repository Actions secrets or attach the GitHub Environment that contains it.'
            exit 1
          fi
          umask 077
          KEYSTORE_PATH="$RUNNER_TEMP/es-teams-release.jks"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"
          test -s "$KEYSTORE_PATH"
          chmod 600 "$KEYSTORE_PATH"

      - name: Build signed release APK
        working-directory: native-app/android
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/es-teams-release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          set +x
          if [ -z "${ANDROID_KEYSTORE_PASSWORD:-}" ]; then
            echo '::error::ANDROID_KEYSTORE_PASSWORD is unavailable to this workflow.'
            exit 1
          fi
          if [ -z "${ANDROID_KEY_ALIAS:-}" ]; then
            echo '::error::ANDROID_KEY_ALIAS is unavailable to this workflow.'
            exit 1
          fi
          if [ -z "${ANDROID_KEY_PASSWORD:-}" ]; then
            echo '::error::ANDROID_KEY_PASSWORD is unavailable to this workflow.'
            exit 1
          fi
          ./gradlew assembleRelease

      - name: Verify release APK signing certificate
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/es-teams-release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          set -euo pipefail
          set +x
          APK_PATH="native-app/android/app/build/outputs/apk/release/app-release.apk"
          CERT_PATH="$RUNNER_TEMP/es-teams-release-cert.der"
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          test -s "$APK_PATH"
          test -n "$SDK_ROOT"
          keytool -exportcert -keystore "$ANDROID_KEYSTORE_PATH" \
            -storepass:env ANDROID_KEYSTORE_PASSWORD \
            -alias "$ANDROID_KEY_ALIAS" -file "$CERT_PATH" >/dev/null 2>&1
          APKSIGNER="$(find "$SDK_ROOT/build-tools" -type f -name apksigner -print | sort -V | tail -n 1)"
          test -x "$APKSIGNER"
          "$APKSIGNER" verify "$APK_PATH" >/dev/null
          SIGNER_INFO="$("$APKSIGNER" verify --print-certs "$APK_PATH" 2>&1)"
          EXPECTED_SHA256="$(sha256sum "$CERT_PATH" | awk '{print $1}' | tr '[:upper:]' '[:lower:]')"
          APK_SHA256="$(printf '%s\n' "$SIGNER_INFO" | awk '{line=tolower($0); if (line ~ /sha/ && line ~ /256/ && line ~ /digest/) {sub(/^.*digest[^:]*:[[:space:]]*/, "", line); print line; exit}}' | tr -d ':[:space:]' | tr '[:upper:]' '[:lower:]')"
          if ! [[ "$EXPECTED_SHA256" =~ ^[0-9a-f]{64}$ ]]; then
            echo '::error::Could not derive the expected certificate fingerprint from the configured keystore.'
            exit 1
          fi
          if ! [[ "$APK_SHA256" =~ ^[0-9a-f]{64}$ ]]; then
            if printf '%s\n' "$SIGNER_INFO" | grep -Eiq 'sha.*256'; then
              echo '::error::apksigner returned SHA-256 metadata, but its fingerprint could not be parsed.'
            else
              echo '::error::apksigner output did not include SHA-256 signer metadata.'
            fi
            exit 1
          fi
          if [ "$EXPECTED_SHA256" != "$APK_SHA256" ]; then
            echo '::error::Release APK certificate does not match the configured keystore.'
            exit 1
          fi
          echo 'Release APK signature verified against the configured keystore certificate.'

      - name: Upload signed release APK
        uses: actions/upload-artifact@v4
        with:
          name: ES-Teams-TV-release-APK
          path: native-app/android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

      - name: Remove temporary signing files
        if: always()
        run: |
          set +x
          rm -f "$RUNNER_TEMP/es-teams-release.jks" "$RUNNER_TEMP/es-teams-release-cert.der"
