<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#0A0A0F">
<title>You're offline · ES TEAMS TV</title>
<style>
  *{box-sizing:border-box}
  :root{color-scheme:dark;--accent:#00E0FF;--accent2:#7c5cff;--text:#F3F3FA;--muted:rgba(243,243,250,.62);--ease:cubic-bezier(.22,1,.36,1)}
  html,body{min-height:100%;margin:0}
  body{min-height:100svh;display:grid;place-items:center;overflow:hidden;padding:24px;background:#0A0A0F;color:var(--text);font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;text-align:center}
  .off-glow{position:fixed;width:min(68vw,640px);aspect-ratio:1;top:50%;left:50%;transform:translate(-50%,-50%);border-radius:50%;background:radial-gradient(circle,rgba(0,224,255,.12),rgba(124,92,255,.07) 38%,transparent 70%);filter:blur(16px);pointer-events:none}
  .off-card{position:relative;width:min(100%,460px);padding:clamp(27px,7vw,42px) clamp(22px,6vw,38px);border:1px solid rgba(255,255,255,.19);border-radius:28px;background:linear-gradient(145deg,rgba(255,255,255,.15),rgba(255,255,255,.035) 45%,rgba(255,255,255,.07)),rgba(18,20,32,.62);box-shadow:0 28px 90px rgba(0,0,0,.44),inset 0 1px 0 rgba(255,255,255,.23);-webkit-backdrop-filter:blur(26px) saturate(145%);backdrop-filter:blur(26px) saturate(145%);animation:off-arrive .72s var(--ease) both}
  .off-brand{display:inline-flex;align-items:center;gap:9px;color:var(--text);font-size:.82rem;font-weight:750;letter-spacing:.025em;text-decoration:none}
  .off-brand img{width:28px;height:28px;border-radius:8px;box-shadow:0 0 22px rgba(0,224,255,.2)}
  .off-mark{position:relative;width:76px;height:76px;margin:30px auto 20px;display:grid;place-items:center;border:1px solid rgba(0,224,255,.26);border-radius:25px;background:linear-gradient(145deg,rgba(0,224,255,.13),rgba(124,92,255,.12)),rgba(255,255,255,.04);box-shadow:0 0 44px rgba(0,224,255,.12),inset 0 1px 0 rgba(255,255,255,.12);animation:off-breathe 3.2s ease-in-out infinite}
  .off-mark svg{width:34px;height:34px;color:var(--accent)}
  .off-mark::after{content:"";position:absolute;inset:-7px;border:1px solid rgba(0,224,255,.14);border-radius:30px;animation:off-ring 2.8s ease-out infinite}
  h1{margin:0 0 9px;font-size:clamp(1.2rem,4vw,1.45rem);letter-spacing:-.025em}
  .off-copy{max-width:340px;margin:0 auto;color:var(--muted);font-size:.9rem;line-height:1.65}
  .off-button{display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:48px;margin-top:27px;padding:0 19px;border:1px solid rgba(0,224,255,.48);border-radius:15px;background:linear-gradient(135deg,rgba(0,224,255,.2),rgba(124,92,255,.2)),rgba(255,255,255,.07);box-shadow:0 10px 30px rgba(0,224,255,.12),inset 0 1px 0 rgba(255,255,255,.17);color:#F3F3FA;font-size:.88rem;font-weight:700;text-decoration:none;transition:transform .24s var(--ease),border-color .24s ease,box-shadow .24s ease,background .24s ease}
  .off-button:hover{transform:translateY(-3px);border-color:rgba(0,224,255,.82);background:linear-gradient(135deg,rgba(0,224,255,.28),rgba(124,92,255,.26)),rgba(255,255,255,.09);box-shadow:0 15px 36px rgba(0,224,255,.2),inset 0 1px 0 rgba(255,255,255,.2)}
  .off-button:active{transform:scale(.97)}
  .off-button:focus-visible{outline:2px solid var(--accent);outline-offset:4px}
  .off-button svg{width:17px;height:17px;transition:transform .24s var(--ease)}
  .off-button:hover svg{transform:rotate(35deg)}
  .off-hint{margin:17px 0 0;color:rgba(243,243,250,.38);font-size:.72rem}
  @keyframes off-arrive{from{opacity:0;transform:translateY(18px) scale(.975);filter:blur(8px)}to{opacity:1;transform:translateY(0) scale(1);filter:blur(0)}}
  @keyframes off-breathe{0%,100%{transform:translateY(0) scale(1)}50%{transform:translateY(-3px) scale(1.025)}}
  @keyframes off-ring{0%{opacity:.6;transform:scale(.92)}100%{opacity:0;transform:scale(1.2)}}
  @media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;scroll-behavior:auto!important;transition-duration:.01ms!important}}
</style>
</head>
<body>
  <div class="off-glow" aria-hidden="true"></div>
  <main class="off-card" aria-labelledby="offline-title">
    <a class="off-brand" href="/" aria-label="ES TEAMS TV home"><img src="/icon-32.png" alt="" width="28" height="28"><span>ES TEAMS TV</span></a>
    <div class="off-mark" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M2 8.8A15.5 15.5 0 0 1 12 5.2a15.5 15.5 0 0 1 10 3.6"/><path d="M5 12a10.5 10.5 0 0 1 14 0"/><path d="M8.5 15.3a5.3 5.3 0 0 1 7 0"/><path d="M12 19h.01"/><path d="m3 3 18 18"/></svg>
    </div>
    <h1 id="offline-title">You're offline</h1>
    <p class="off-copy">We can't reach ES TEAMS TV right now. Check your internet connection and try again.</p>
    <a class="off-button" href="" aria-label="Try loading this page again">Try again
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"/><path d="M8 16H3v5"/></svg>
    </a>
    <p class="off-hint">Your page will be here when you're back online.</p>
  </main>
</body>
</html>
